version: 2
updates:
  # ROOT npm ecosystem intentionally NOT managed by Dependabot (ARC-304).
  #
  # This repo uses bun + `bun.lock`. Dependabot's npm updater bumps
  # `package.json` but cannot regenerate `bun.lock` (bun's lockfile is
  # unsupported), so every root npm PR left the lockfile stale and CI
  # (`bun install --frozen-lockfile` in ci.yml + security.yml) failed with
  # "lockfile had changes, but lockfile is frozen".
  #
  # Root dependency freshness is now handled natively by
  # .github/workflows/deps-bun-update.yml, which runs `bun update`,
  # regenerates `bun.lock` in the SAME commit as the manifest bumps, and opens
  # its own PR (green under --frozen-lockfile). CVE detection is unchanged:
  # `bun audit` + OSV scan run on every PR/push and on the weekly Security cron.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all GitHub Actions bumps into a single weekly PR so the backlog
    # stays drainable via auto-merge instead of accumulating one-per-action.
    groups:
      github-actions:
        patterns:
          - "*"
