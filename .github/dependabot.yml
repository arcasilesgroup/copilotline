version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Prefix is a bare Conventional-Commit type (no scope). `include: scope`
    # appends dependabot's own dependency scope -> "chore(deps): ..." /
    # "chore(deps-dev): ...", which is single-scope and passes the
    # "Commit lint (PR title)" required check. The previous prefix
    # "chore(deps)" produced double-scope titles ("chore(deps)(deps-dev): ...")
    # that fail the Conventional-Commit regex and blocked every PR. (ARC-270)
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      types:
        patterns:
          - "@types/*"
      bun-stack:
        patterns:
          - "@types/bun"
          - "@types/node"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all GitHub Actions bumps into a single weekly PR so the backlog
    # stays drainable via auto-merge instead of accumulating one-per-action.
    groups:
      github-actions:
        patterns:
          - "*"
